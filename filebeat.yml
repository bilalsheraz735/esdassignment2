filebeat.inputs:
  - type: log
    enabled: true
    paths:
      - /usr/share/filebeat/app-logs.json
    json.keys_under_root: true
    json.add_error_key: true

processors:
  - rename:
      fields:
        - from: "service"
          to: "app_service"
      ignore_missing: true
      fail_on_error: false

output.elasticsearch:
  hosts: ["elasticsearch:9200"]

logging.to_files: false
logging.to_stderr: true