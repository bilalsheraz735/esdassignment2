openapi: 3.0.3
info:
  title: Fast-Food API
  version: 2.1.0
  description: >
    Place fast-food orders. Orders are idempotent per idempotency_key (shared with the gRPC
    service), and POST /order is rate limited to 5 requests per 10 seconds across all callers.
    Every error response uses the same body: {"error": "<message>"}.
servers:
  - url: http://localhost:5000
paths:
  /order:
    post:
      summary: Place a new order (or get back the order already placed with this key)
      operationId: placeOrder
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderRequest'
            example:
              idempotency_key: order-2026-001
      responses:
        '200':
          description: Order cooked, or returned from the idempotency store (safe repeat).
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
              examples:
                new:
                  value: {status: "Order ready!", order_id: ord_1a2b3c4d}
                repeat:
                  value: {status: "Order already processed (safe repeat)", order_id: ord_1a2b3c4d}
        '400':
          description: Body is not a JSON object, or idempotency_key is missing or invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {error: "idempotency_key is required"}
        '429':
          description: Rate limit exceeded (5 requests / 10 s, shared by all callers).
          headers:
            Retry-After:
              description: Whole seconds until the current window ends (at least 1).
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {error: "Too Many Requests"}
        '500':
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  parameters:
    RequestId:
      name: X-Request-ID
      in: header
      required: false
      description: Trace id for log correlation. Generated by the server if absent; echoed back.
      schema:
        type: string
        maxLength: 64
  headers:
    RequestId:
      description: The trace id used in the server logs for this request.
      schema:
        type: string
  schemas:
    OrderRequest:
      type: object
      required: [idempotency_key]
      properties:
        idempotency_key:
          type: string
          minLength: 1
          maxLength: 100
          pattern: '^[A-Za-z0-9._:-]{1,100}$'
          description: Unique per order. Reusing it returns the original order instead of cooking again.
    OrderResponse:
      type: object
      required: [status, order_id]
      properties:
        status:
          type: string
          enum: ["Order ready!", "Order already processed (safe repeat)"]
        order_id:
          type: string
          pattern: '^ord_[0-9a-f]{8}$'
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
