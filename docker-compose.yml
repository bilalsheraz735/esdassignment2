services:
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus # <-- ADDED: Saves your historical metrics
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana # <-- ADDED: Saves your dashboards and logins

  node-exporter:
    image: prom/node-exporter:latest
    ports:
      - "9100:9100"    
      
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
    ports:
      - "9200:9200"
    mem_limit: 1024m
    volumes:
      - es_data:/usr/share/elasticsearch/data # <-- ADDED: Saves your Kibana logs

  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.0
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    depends_on:
      - elasticsearch    
      
  filebeat:
    image: docker.elastic.co/beats/filebeat:8.11.0
    container_name: esd-filebeat-1
    user: root
    volumes:
      - ./filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - ./app-logs.json:/usr/share/filebeat/app-logs.json
    command: ["--strict.perms=false"]
    depends_on:
      - elasticsearch

# <-- ADDED: Declares the persistent virtual hard drives for Docker
volumes:
  grafana_data:
  prometheus_data:
  es_data: